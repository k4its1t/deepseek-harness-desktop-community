name: Bug report
description: Report a reproducible desktop-wrapper problem
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS arm64
        - macOS x64
        - Windows x64
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Do not include API keys or other secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpts
      description: Review and redact paths or secrets before posting.
