<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
    <title>DeepSeek Harness Desktop</title>
    <link rel="stylesheet" href="./loading.css">
  </head>
  <body>
    <main class="card">
      <img src="../build/icon.png" alt="" width="84" height="84">
      <h1>DeepSeek Harness Desktop</h1>
      <p id="status">Starting the local agent runtime…</p>
      <div id="spinner" class="spinner" aria-label="Loading"></div>
      <div id="recovery" hidden>
        <button id="retry" type="button">Retry / 重试</button>
        <button id="logs" type="button">Open logs / 打开日志</button>
      </div>
    </main>
    <script type="module" src="./loading.mjs"></script>
  </body>
</html>
